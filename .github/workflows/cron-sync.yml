name: Rainbet sync

on:
  schedule:
    # Rainbet's own response cache refreshes at most every 10 minutes, so
    # syncing more often than this just re-fetches the same cached payload.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call the protected sync route
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "https://jbalin.netlify.app/api/cron/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat /tmp/response.json
          echo
          if [ "$status" -ge 400 ]; then
            echo "Sync failed with HTTP $status"
            exit 1
          fi
